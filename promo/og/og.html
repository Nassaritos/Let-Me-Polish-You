<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Lato:wght@700;900&family=Ms+Madi&display=block" rel="stylesheet" />
<style>
  /* Site share card, 1200×630. Rendered by promo/scripts/og-image.mjs → app/opengraph-image.jpg */
  :root { --red: #fc3a3a; --red-ink: #d92b2b; --ink: #151515; --grey: #5c5c5c; --paper: #fff; --mist: #f6f5f3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
  body { position: relative; font-family: Lato, sans-serif; color: var(--ink); }
  .blob { position: absolute; border-radius: 50%; filter: blur(40px); }
  .b1 { width: 760px; height: 760px; right: -260px; top: -300px; background: radial-gradient(circle, rgba(252,58,58,0.10), transparent 62%); }
  .b2 { width: 560px; height: 560px; left: -260px; bottom: -320px; background: radial-gradient(circle, rgba(252,58,58,0.07), transparent 65%); }

  .left { position: absolute; left: 64px; top: 52px; bottom: 50px; width: 600px; display: flex; flex-direction: column; }
  .logo { width: 150px; }
  .kicker { font-family: "Ms Madi", cursive; color: var(--red); font-size: 54px; line-height: 1; margin-top: 26px; }
  h1 { font-family: Montserrat, sans-serif; font-weight: 900; font-size: 64px; line-height: 0.98; letter-spacing: -0.02em; text-transform: uppercase; margin-top: 6px; }
  .hl { position: relative; display: inline-block; }
  .hl svg { position: absolute; left: -3%; top: 46%; width: 106%; height: 0.42em; }
  .hl span { position: relative; }
  .products { display: flex; gap: 26px; align-items: center; margin-top: auto; }
  .products img { height: 44px; }
  .live { display: flex; align-items: center; gap: 12px; margin-top: 22px; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 17px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--grey); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 5px rgba(252,58,58,0.18); }

  .pol { position: absolute; background: var(--paper); padding: 12px 12px 4px; border-radius: 10px; box-shadow: 0 26px 50px -22px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.05); }
  .pol .ph { width: 100%; overflow: hidden; border-radius: 5px; background: var(--mist); }
  .pol img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pol p { font-family: "Ms Madi", cursive; font-size: 36px; text-align: center; line-height: 1.15; }
  .p1 { width: 320px; left: 694px; top: 34px; transform: rotate(-4deg); }
  .p1 .ph { height: 200px; }
  .p2 { width: 250px; left: 932px; top: 150px; transform: rotate(5deg); }
  .p2 .ph { height: 168px; }
  .p3 { width: 290px; left: 716px; top: 326px; transform: rotate(2deg); }
  .p3 .ph { height: 178px; }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <div class="left">
    <img class="logo" src="../../public/brand/lmpy-ink.png" alt="" />
    <div class="kicker">volunteer, intern or teach</div>
    <h1>Your next<br />experience is<br /><span class="hl"><svg viewBox="0 0 400 40" preserveAspectRatio="none"><path d="M2 33 C 60 27, 130 11, 220 9 C 292 7, 352 10, 398 3 C 362 22, 302 27, 232 29 C 152 31, 82 39, 2 33 Z" fill="#fc3a3a" /></svg><span>in Poland.</span></span></h1>
    <div class="products">
      <img src="../../public/brand/products/gv-color.png" alt="" />
      <img src="../../public/brand/products/gta-color.png" alt="" />
      <img src="../../public/brand/products/gte-color.png" alt="" />
    </div>
    <div class="live"><span class="dot"></span>Live opportunities · AIESEC in Poland</div>
  </div>

  <div class="pol p1"><div class="ph"><img src="../../public/images/youth/juwenalia-crowd.jpg" alt="" style="object-position: 50% 70%" /></div><p>new friends</p></div>
  <div class="pol p3"><div class="ph"><img src="../../public/images/poland/pierogi.jpg" alt="" style="object-position: 60% 60%" /></div><p>eat pierogi</p></div>
  <div class="pol p2"><div class="ph"><img src="../../public/images/poland/morskie-oko.jpg" alt="" /></div><p>weekends like this</p></div>
</body>
</html>
